services:
  - type: web
    name: repo-explainer-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
      - key: MAX_FILES_TO_ANALYZE
        value: "20"
      - key: MAX_FILE_SIZE_BYTES
        value: "50000"
      - key: MAX_TOTAL_PROMPT_BYTES
        value: "400000"
      - key: CORS_ORIGINS
        value: '["https://repo-explainer-weld.vercel.app"]'
